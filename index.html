<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>給王佑瀚的生日小卡片 🎂</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "PingFang TC",
                "Microsoft JhengHei",
                sans-serif;
            background:
                radial-gradient(circle at 20% 20%, #fff7fb 0%, transparent 30%),
                radial-gradient(circle at 80% 80%, #f0f5ff 0%, transparent 30%),
                linear-gradient(135deg, #fceef5, #eef3ff);
            display: flex;
            justify-content: center;
            align-items: center;
            color: #555;
        }

        .stars {
            position: fixed;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
        }

        .star {
            position: absolute;
            color: white;
            font-size: 18px;
            opacity: .7;
            animation: twinkle 2.5s infinite ease-in-out;
        }

        .star:nth-child(1) { left: 10%; top: 15%; animation-delay: 0s; }
        .star:nth-child(2) { left: 85%; top: 20%; animation-delay: .8s; }
        .star:nth-child(3) { left: 20%; top: 75%; animation-delay: 1.2s; }
        .star:nth-child(4) { left: 75%; top: 70%; animation-delay: .4s; }
        .star:nth-child(5) { left: 50%; top: 10%; animation-delay: 1.5s; }

        @keyframes twinkle {
            0%, 100% { transform: scale(.7); opacity: .3; }
            50% { transform: scale(1.2); opacity: 1; }
        }

        .scene {
            position: relative;
            width: 430px;
            height: 500px;
            perspective: 1200px;
        }

        .instruction {
            position: fixed;
            bottom: 8%;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            letter-spacing: 2px;
            color: #9b7c88;
            z-index: 5;
            white-space: nowrap;
        }

        /* Envelope */
        .envelope {
            position: absolute;
            width: 360px;
            height: 230px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            cursor: pointer;
            filter: drop-shadow(0 18px 25px rgba(80, 60, 80, .15));
            transition: transform .8s ease, opacity .8s ease;
            z-index: 10;
        }

        .envelope-back {
            position: absolute;
            inset: 0;
            background: #f6dce7;
            border-radius: 8px;
        }

        .envelope-left {
            position: absolute;
            left: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 115px solid transparent;
            border-bottom: 115px solid transparent;
            border-left: 180px solid #edc6d6;
            z-index: 12;
        }

        .envelope-right {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 0;
            height: 0;
            border-top: 115px solid transparent;
            border-bottom: 115px solid transparent;
            border-right: 180px solid #edc6d6;
            z-index: 12;
        }

        .envelope-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-bottom: 130px solid #e9bfd0;
            z-index: 13;
        }

        .flap {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 0;
            border-left: 180px solid transparent;
            border-right: 180px solid transparent;
            border-top: 125px solid #f8dfe9;
            transform-origin: top center;
            transition: transform 1s cubic-bezier(.4, 0, .2, 1);
            z-index: 16;
        }

        /* Card stack */
        .card-stack {
            position: absolute;
            width: 360px;
            height: 320px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%) translateY(70px);
            opacity: 0;
            pointer-events: none;
            transition:
                transform 1.2s cubic-bezier(.2,.8,.2,1),
                opacity .5s ease;
            z-index: 20;
        }

        .page {
            position: absolute;
            inset: 0;
            background: #fffdfd;
            border: 1px solid #f1dfe6;
            border-radius: 14px;
            box-shadow: 0 15px 35px rgba(80, 60, 80, .16);
            padding: 20px 20px 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            transform-origin: left center;
            backface-visibility: hidden;
            overflow: hidden;
        }

        .page-content {
            max-height: 250px;
            overflow-y: auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            scrollbar-width: none;
        }

        .page-content::-webkit-scrollbar {
            display: none;
        }

        .page::before {
            content: "";
            position: absolute;
            inset: 10px;
            border: 1px solid rgba(235, 201, 215, .65);
            border-radius: 10px;
            pointer-events: none;
        }

        .page-number {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 11px;
            color: #c3a8b2;
            letter-spacing: 1px;
            z-index: 2;
        }

        .page h2 {
            font-size: 19px;
            font-weight: 600;
            color: #a56f83;
            margin-bottom: 8px;
            z-index: 2;
        }

        .page p {
            width: 100%;
            max-width: 290px;
            font-size: 13.5px;
            line-height: 1.6;
            color: #555;
            white-space: pre-line;
            z-index: 2;
            overflow-wrap: break-word;
        }

        /* 大尊月老圖片專用與彈出動畫 */
        .page .god-image {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 0 20px rgba(234, 178, 122, 0.6), 0 8px 18px rgba(165, 111, 131, 0.25);
            margin-bottom: 10px;
            z-index: 2;
        }

        .page.active .god-image {
            animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes popIn {
            0% {
                transform: scale(0.2);
                opacity: 0;
            }
            70% {
                transform: scale(1.15);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .page .emoji {
            font-size: 26px;
            margin-bottom: 6px;
            z-index: 2;
        }

        .page small {
            margin-top: 8px;
            color: #b89ca7;
            font-size: 11px;
            letter-spacing: 1px;
            z-index: 2;
        }

        .page.active {
            z-index: 5;
            animation: pageIn .55s ease both;
        }

        .page.exit {
            z-index: 6;
            animation: pageOut .55s ease both;
        }

        @keyframes pageIn {
            from {
                opacity: 0;
                transform: rotateY(-55deg) translateX(25px);
            }
            to {
                opacity: 1;
                transform: rotateY(0) translateX(0);
            }
        }

        @keyframes pageOut {
            from {
                opacity: 1;
                transform: rotateY(0) translateX(0);
            }
            to {
                opacity: 0;
                transform: rotateY(55deg) translateX(-25px);
            }
        }

        /* 控制按鈕區塊 */
        .controls {
            position: absolute;
            left: 50%;
            bottom: -55px;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: opacity .5s ease;
            width: max-content;
        }

        .controls.show {
            opacity: 1;
            pointer-events: auto;
        }

        .nav-btn {
            border: 0;
            background: rgba(255,255,255,.95);
            color: #9b7182;
            border: 1px solid #ecd9e2;
            border-radius: 999px;
            padding: 8px 18px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(80,60,80,.12);
            transition: transform .2s ease, background .2s ease;
        }

        .nav-btn:hover {
            transform: translateY(-2px);
            background: #ffffff;
            color: #7a5162;
        }

        .nav-btn:disabled {
            opacity: .4;
            cursor: default;
            transform: none;
        }

        .dots {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #dec7d1;
            transition: all .3s ease;
        }

        .dot.active {
            width: 18px;
            border-radius: 99px;
            background: #b98b9e;
        }

        .final-message {
            position: fixed;
            left: 50%;
            bottom: 4%;
            transform: translateX(-50%) translateY(20px);
            opacity: 0;
            color: #9b7c88;
            font-size: 14px;
            letter-spacing: 2px;
            transition: all 1s ease;
            pointer-events: none;
            white-space: nowrap;
            font-weight: 500;
            z-index: 40;
        }

        .final-message.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .heart {
            position: fixed;
            pointer-events: none;
            font-size: 20px;
            z-index: 50;
            animation: floatUp 3s ease-out forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(.5) rotate(0deg);
                opacity: 0;
            }
            20% { opacity: 1; }
            100% {
                transform: translateY(-220px) scale(1.2) rotate(25deg);
                opacity: 0;
            }
        }

        .opened .flap {
            transform: rotateX(180deg);
            z-index: 1;
        }

        .opened .envelope {
            transform: translate(-50%, -50%) translateY(140px);
            opacity: 0.2;
        }

        .opened .card-stack {
            opacity: 1;
            pointer-events: auto;
            transform: translate(-50%, -50%) translateY(-30px);
        }

        /* 點開後提示文字立即隱藏 */
        .opened .instruction {
            display: none !important;
        }

        @media (max-width: 600px) {
            .scene {
                transform: scale(.85);
            }

            .card-stack {
                width: 330px;
                height: 310px;
            }

            .controls {
                bottom: -60px;
            }
        }
    </style>
</head>

<body>

    <div class="stars">
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
        <div class="star">✧</div>
        <div class="star">✦</div>
    </div>

    <div class="scene" id="scene">

        <div class="envelope" id="envelope">
            <div class="envelope-back"></div>
            <div class="envelope-left"></div>
            <div class="envelope-right"></div>
            <div class="envelope-bottom"></div>
            <div class="flap"></div>
        </div>

        <div class="card-stack" id="cardStack"></div>

        <div class="controls" id="controls">
            <button class="nav-btn" id="prevBtn">← 上一張</button>
            <div class="dots" id="dots"></div>
            <button class="nav-btn" id="nextBtn">下一張 →</button>
        </div>
    </div>

    <div class="instruction" id="instruction">
        點擊信封，打開生日卡片 ✦
    </div>

    <div class="final-message" id="finalMessage">
        願你新的一歲，一切都剛剛好。 ♡
    </div>

    <script>
        // 進入網頁時立刻跳出輸入框，密碼不對就重複跳出或關閉
const password = prompt("防盜用密碼(6位)：");
if (password !== "961001") { // 這裡可以改成你設定的密碼（例如他的生日）
    alert("ERROR！");
    document.body.innerHTML = "<h2 style='text-align:center;margin-top:20%;color:#888;'>驗證失敗，請重新整理頁面輸入正確密碼。</h2>";
    throw new Error("Wrong password");
}
        const pages = [
            {
                label: "FOR YOU",
                title: "給王佑瀚 🎂",
                emoji: "✉️",
                text:
`我們認識這麼久了，
這好像是第一次生日沒有一起過。

突然就各自上了大學，
心裡還真的有點小感慨。`,
                hint: "點擊按鈕或卡片看下一頁 →"
            },

            {
                label: "I MISS TAIPEI",
                title: "我要回台北",
                emoji: "✦",
                text:
`原本以為我們可以一起在台北讀大學的。

雖然最後結果不太一樣，
但希望接下來的日子，
老天可以對我們好一點，別再弄我們了。`,
                hint: "下一頁 →"
            },

            {
                label: "THIS TIME",
                title: "我很厲害",
                emoji: "🎁",
                text:
`以前也寫過這種卡片給你，
但那時候寫得比較隨意，而且是一次發給很多人。

總覺得少了點「王佑瀚專屬」的儀式感。

所以這次我有認真。`,
                hint: "下一頁 →"
            },

            {
                label: "A LITTLE SURPRISE",
                title: "浪漫資工女",
                emoji: "💻",
                text:
`既然這次生日沒辦法親自幫你慶祝，
我就發揮一下資工系的專長——

為你寫一個之前也有的線上卡片。

希望你能發揮想像力
想像這是實體的卡片。`,
                hint: "下一頁 →"
            },

            {
                label: "BTW",
                title: "先說好喔",
                emoji: "⚙️",
                text:
`這是我自己刻出來的前端介面。

如果翻頁有點小bug或卡卡的，
看在我熬夜寫Code的份上，不要罵我！

我真的盡力了。`,
                hint: "下一頁 →"
            },

            {
                label: "ONE LAST THING",
                title: "這次沒有句子",
                emoji: "🌷",
                text:
`通常卡片寫到這裡，
我都會附上一句我很喜歡的名言佳句。

但今年沒讀到什麼特別厲害的句子，
所以只想送你一點小小的祝福：

希望你可以做自己，少點煩惱，平安健康。`,
                hint: "下一頁 →"
            },

            {
                label: "I AM PRETTY",
                title: "你很靠北",
                emoji: "🤝",
                text:
`很期待繼續跟你一起長大，

一起變成那個「很靠北」但又很有肩膀的大人。

無論在哪裡，
都要一起變成我們想成為的人。`,
                hint: "下一頁 →"
            },

            // 🌸 新增：月老許願頁面
            {
                label: "MAKE A WISH",
                title: "月老親自加持",
                image: "yue_lao.jpg", // 請確保圖片名稱一致
                text:
`知道你現在最需要什麼，
特地幫你請了月老尊神！

19歲桃花朵朵開，
早日牽線成功、脫單順利！`,
                hint: "許完願按下一頁 →"
            },

            {
                label: "HAPPY BIRTHDAY",
                title: "生日快樂！",
                emoji: "🎉",
                text:
`最後——

不只是今天生日快樂，

更希望你每天都快樂。`,
                hint: "♡"
            }
        ];　 
 

        const envelope = document.getElementById("envelope");
        const scene = document.getElementById("scene");
        const cardStack = document.getElementById("cardStack");
        const controls = document.getElementById("controls");
        const dots = document.getElementById("dots");
        const prevBtn = document.getElementById("prevBtn");
        const nextBtn = document.getElementById("nextBtn");
        const finalMessage = document.getElementById("finalMessage");

        let opened = false;
        let currentPage = 0;
        let animating = false;

        function createPage(page, index) {
            const element = document.createElement("div");
            element.className = "page";

            element.innerHTML = `
                <div class="page-number">${index + 1} / ${pages.length}</div>
                <div class="page-content">
                    ${page.image ? `<img src="${page.image}" class="god-image" alt="月老">` : ""}
                    ${page.emoji && !page.image ? `<div class="emoji">${page.emoji}</div>` : ""}
                    ${page.title ? `<h2>${page.title}</h2>` : ""}
                    ${page.text ? `<p>${page.text}</p>` : ""}
                </div>
                <small>${page.hint}</small>
            `;

            return element;
        }

        function buildPages() {
            cardStack.innerHTML = "";

            pages.forEach((page, index) => {
                const element = createPage(page, index);

                if (index === currentPage) {
                    element.classList.add("active");
                } else {
                    element.style.display = "none";
                }

                cardStack.appendChild(element);
            });

            buildDots();
        }

        function buildDots() {
            dots.innerHTML = "";

            pages.forEach((_, index) => {
                const dot = document.createElement("div");
                dot.className = "dot";

                if (index === currentPage) {
                    dot.classList.add("active");
                }

                dots.appendChild(dot);
            });
        }

        function updateButtons() {
            prevBtn.disabled = currentPage === 0;

            if (currentPage === pages.length - 1) {
                nextBtn.textContent = "再看一次 ↺";
            } else {
                nextBtn.textContent = "下一張 →";
            }

            buildDots();
        }

        function goToPage(newPage) {
            if (animating) return;

            if (newPage >= pages.length) {
                currentPage = 0;
                showCurrentPageWithoutAnimation();
                return;
            }

            if (newPage < 0 || newPage === currentPage) return;

            animating = true;

            const oldPage = cardStack.children[currentPage];
            const newPageElement = cardStack.children[newPage];

            oldPage.classList.remove("active");
            oldPage.classList.add("exit");

            setTimeout(() => {
                oldPage.classList.remove("exit");
                oldPage.style.display = "none";

                currentPage = newPage;

                newPageElement.style.display = "flex";

                void newPageElement.offsetWidth;

                newPageElement.classList.add("active");

                updateButtons();

                setTimeout(() => {
                    animating = false;
                }, 550);

            }, 400);

            if (newPage === pages.length - 1) {
                setTimeout(createHearts, 450);
                setTimeout(() => {
                    finalMessage.classList.add("show");
                }, 800);
            } else {
                finalMessage.classList.remove("show");
            }
        }

        function showCurrentPageWithoutAnimation() {
            Array.from(cardStack.children).forEach((page, index) => {
                page.style.display = index === currentPage ? "flex" : "none";
                page.classList.remove("active", "exit");
            });

            const current = cardStack.children[currentPage];
            current.classList.add("active");

            updateButtons();
            finalMessage.classList.remove("show");
        }

        function createHearts() {
            const hearts = ["♡", "♥", "✦", "✧", "🎂", "🌸"];

            for (let i = 0; i < 22; i++) {
                setTimeout(() => {
                    const heart = document.createElement("div");

                    heart.className = "heart";
                    heart.innerText =
                        hearts[Math.floor(Math.random() * hearts.length)];

                    heart.style.left = (10 + Math.random() * 80) + "%";
                    heart.style.bottom = "20%";
                    heart.style.fontSize =
                        (14 + Math.random() * 16) + "px";
                    heart.style.animationDuration =
                        (2.2 + Math.random() * 1.8) + "s";

                    document.body.appendChild(heart);

                    setTimeout(() => heart.remove(), 4000);
                }, i * 90);
            }
        }

        envelope.addEventListener("click", () => {
            if (opened) return;

            opened = true;
            scene.classList.add("opened");

            setTimeout(() => {
                controls.classList.add("show");
            }, 800);
        });

        prevBtn.addEventListener("click", () => {
            goToPage(currentPage - 1);
        });

        nextBtn.addEventListener("click", () => {
            goToPage(currentPage + 1);
        });

        cardStack.addEventListener("click", (event) => {
            if (!opened || animating) return;

            const rect = cardStack.getBoundingClientRect();
            const clickX = event.clientX - rect.left;

            if (clickX > rect.width / 2) {
                goToPage(currentPage + 1);
            } else {
                goToPage(currentPage - 1);
            }
        });

        buildPages();
        updateButtons();
    </script>

</body>
</html>
